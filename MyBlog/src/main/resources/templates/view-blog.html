<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title} + ' | MyBlog'">Read Blog | MyBlog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">MyBlog</a>
    <a class="text-link" th:href="@{/}">← All posts</a>
</header>

<main class="container article-container">
    <article class="article">
        <p class="eyebrow">FROM MYBLOG</p>
        <h1 th:text="${blog.title}">Blog title</h1>
        <div class="article-content" th:text="${blog.content}">Blog content</div>
        <div class="article-actions">
            <a class="button secondary" th:href="@{/}">Back to home</a>
            <a class="delete-link" th:href="@{/delete/{id}(id=${blog.id})}"
               onclick="return confirm('Are you sure you want to delete this blog?');">Delete this post</a>
        </div>
    </article>
</main>
</body>
</html>
