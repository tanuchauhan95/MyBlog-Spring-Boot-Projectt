<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBlog | Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">MyBlog</a>
    <a class="button" th:href="@{/add}">+ Write a Blog</a>
</header>

<main class="container">
    <section class="hero">
        <p class="eyebrow">YOUR SPACE, YOUR STORIES</p>
        <h1>Ideas worth sharing.</h1>
        <p>Read stories and share your thoughts with the world.</p>
    </section>

    <p class="notice" th:if="${message}" th:text="${message}"></p>

    <section>
        <h2 class="section-title">Latest posts</h2>

        <div class="empty-state" th:if="${#lists.isEmpty(blogs)}">
            <h3>No blog posts yet</h3>
            <p>Be the first to share a story.</p>
            <a class="button" th:href="@{/add}">Create your first blog</a>
        </div>

        <article class="blog-card" th:each="blog : ${blogs}">
            <h3 th:text="${blog.title}">Blog title</h3>
            <p class="preview" th:text="${#strings.abbreviate(blog.content, 180)}">Blog preview</p>
            <div class="card-actions">
                <a th:href="@{/view/{id}(id=${blog.id})}">Read more →</a>
                <a class="delete-link"
                   th:href="@{/delete/{id}(id=${blog.id})}"
                   onclick="return confirm('Are you sure you want to delete this blog?');">Delete</a>
            </div>
        </article>
    </section>
</main>

<footer>Made with Spring Boot · MyBlog</footer>
</body>
</html>
